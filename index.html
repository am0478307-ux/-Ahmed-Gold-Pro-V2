
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ahmed Gold Pro V2</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:white;font-family:Arial;padding:15px}
h1{text-align:center;color:#e8bd55}
.card{background:#172235;padding:17px;border-radius:14px;margin:15px 0}
.price{font-size:25px;color:#e8bd55;font-weight:bold}
button{background:#e8bd55;border:0;padding:12px;border-radius:8px;font-weight:bold}
.frames{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
.frames button{flex:1;min-width:65px}
.frames button.active{background:#fff}
.chart{height:480px;width:100%;overflow:hidden;border-radius:10px}
.chart iframe{width:100%;height:100%;border:0}
small{color:#aaa}
</style>
</head>
<body>

<h1>AHMED GOLD PRO</h1>
<p style="text-align:center">منصة متابعة الذهب XAUUSD</p>

<div class="card">
<h3>سعر الذهب بالدولار للأونصة</h3>
<div class="price" id="usd">جاري التحميل...</div>
</div>

<div class="card">
<h3>سعر الذهب بالريال للجرام</h3>
<div class="price" id="sar">جاري التحميل...</div>
</div>

<div class="card">
<h3>الرسم البياني للذهب</h3>
<div class="frames">
<button onclick="changeFrame('5')">5 دقائق</button>
<button class="active" onclick="changeFrame('15')">15 دقيقة</button>
<button onclick="changeFrame('60')">ساعة</button>
<button onclick="changeFrame('240')">4 ساعات</button>
</div>
<div class="chart">
<iframe id="goldChart"
src="https://s.tradingview.com/widgetembed/?symbol=OANDA%3AXAUUSD&interval=15&hidesidetoolbar=0&symboledit=1&saveimage=0&toolbarbg=%23080d18&theme=dark&style=1&locale=ar"
allowfullscreen>
</iframe>
</div>
<small>الرسم من TradingView، والسعر قد يختلف عن Exness.</small>
</div>

<div class="card">
<h3>حالة النظام</h3>
<p id="status">جاري الاتصال...</p>
<button onclick="loadGold()">تحديث الأسعار</button>
</div>

<script>
function changeFrame(frame){
document.querySelectorAll('.frames button').forEach(b=>{
b.classList.remove('active');
});
event.target.classList.add('active');
document.getElementById('goldChart').src=
'https://s.tradingview.com/widgetembed/?symbol=OANDA%3AXAUUSD&interval='+
frame+'&hidesidetoolbar=0&symboledit=1&saveimage=0&toolbarbg=%23080d18&theme=dark&style=1&locale=ar';
}

async function loadGold(){
try{
let r=await fetch('https://goldprice.corgano.com/api/v1/latest?currency=SAR');
if(!r.ok) throw Error();
let j=await r.json();
let d=j.data;
document.getElementById('usd').textContent=
Number(d.price_usd.per_oz).toFixed(2)+' USD';
document.getElementById('sar').textContent=
Number(d.currencies.SAR.per_gram).toFixed(2)+' SAR';
document.getElementById('status').textContent='متصل بنجاح';
}catch(e){
document.getElementById('status').textContent='تعذر تحديث الأسعار';
}
}
loadGold();
setInterval(loadGold,60000);
</script>

</body>
</html>
